<title id="title">Nayori — Linux desktop shell</title>
<desc id="desc">Декоративная обложка в виде рабочего стола: графитовый фон, лавандовые окна, остров с часами и нижняя панель. Это иллюстрация, а не снимок интерфейса.</desc>
